# ── Database (H2 in-memory, PostgreSQL compatibility mode) ────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ── Flyway (disabled for unit tests — H2 DDL handles schema) ──
spring.flyway.enabled=false

# ── JWT ───────────────────────────────────────────────────────
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# ── Mail (disabled — JavaMailSender is mocked in tests) ───────
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=dummy
app.mail.from=test@example.com
app.base-url=http://localhost:8080

# ── Disable async in tests (makes email calls synchronous/mockable) ──
spring.task.execution.pool.core-size=1