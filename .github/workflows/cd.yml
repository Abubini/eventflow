name: CD — Build, Push & Deploy

on:
  push:
    branches:
      - main

jobs:
  # ── Job 1: Run all tests first ──────────────────────────────
  test:
    name: Compile & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       eventflow_test
          POSTGRES_USER:     eventflow
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventflow -d eventflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:5432/eventflow_test
          SPRING_DATASOURCE_USERNAME: eventflow
          SPRING_DATASOURCE_PASSWORD: testpassword
          APP_JWT_SECRET:             ${{ secrets.JWT_SECRET }}
          SPRING_MAIL_USERNAME:       test@example.com
          SPRING_MAIL_PASSWORD:       dummy
          APP_MAIL_FROM:              test@example.com
        run: mvn verify -q

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # ── Job 2: Build Docker image and push to GHCR ──────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test        # only runs if tests pass

    permissions:
      contents: read
      packages: write  # needed to push to GHCR

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Tag with short git SHA: ghcr.io/owner/eventflow:abc1234
            type=sha,prefix=,format=short
            # Also tag as latest on main
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between builds using the GitHub Actions cache
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Job 3: Deploy to server via SSH ─────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push   # only runs if image was pushed successfully
    environment: production  # uses GitHub Environment secrets (optional gate)

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            cd /opt/eventflow

            # Pull the latest image
            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/${{ github.repository }}:latest

            # Zero-downtime restart: bring up new container before stopping old
            docker compose pull
            docker compose up -d --no-deps --remove-orphans app

            # Clean up old dangling images to save disk space
            docker image prune -f

            echo "✅ Deployment complete"