name: CI — Test

on:
  push:
    branches-ignore:
      - main        # main is handled by cd.yml
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Compile & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       eventflow_test
          POSTGRES_USER:     eventflow
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventflow -d eventflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests
        env:
          SSPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/eventflow_test
          SPRING_DATASOURCE_USERNAME: eventflow
          SPRING_DATASOURCE_PASSWORD: testpassword
          APP_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_RESEND_API_KEY: re_dummy_key_for_ci
        run: mvn verify -q

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7